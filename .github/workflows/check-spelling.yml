name: Spelling

on:
  merge_group:
  pull_request:

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spelling-check:
    name: SPELLING check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run ci:min
      - run: npm run check:spelling

  dict-check:
    name: CSPELL word lists check
    runs-on: ubuntu-latest
    env:
      FIX_CMD: fix:dict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Note: FIX_CMD runs fine without setup-node
      - run: npm run ${FIX_CMD}
      - name: Any changed files?
        run: |
          CHANGES=`git status --porcelain`
          if [[ $CHANGES ]]; then
            echo "Add comment '/${FIX_CMD}' to your PR in GitHub,"
            echo "or locally run 'npm run ${FIX_CMD}' and commit the changes:"
            echo "$CHANGES"
            exit 1
          else
            echo "cSpell front-matter ignore lists and .cspell/*.txt word lists are normalized and sorted."
          fi
