name: Auto-update community members page

on:
  workflow_dispatch:
  schedule:
    # At 03:41, every day
    - cron: 41 3 * * *

permissions:
  contents: read

# Overlapping runs would race updates to the shared automation branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  auto-update:
    name: Auto-update community members page
    runs-on: ubuntu-latest
    # Remove the if statement below when testing against a fork
    if: github.repository == 'open-telemetry/opentelemetry.io'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: fix:link-cache needs the drift-status baseline commit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run:
          npm run ci:min -- --workspace=@opentelemetry/generate-community-data

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: otelbot-token
        with:
          # the higher privileged docs token is needed to push commits to an existing PR
          client-id: ${{ vars.OTELBOT_DOCS_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_DOCS_PRIVATE_KEY }}
          permission-contents: write
          permission-members: read
          permission-pull-requests: write

      - name: Run script
        working-directory: ./scripts/generate-community-data
        run: node generate.js ../../data/community/members.yaml
        env:
          GITHUB_TOKEN: ${{ steps.otelbot-token.outputs.token }}

      - name: Use CLA approved github bot
        run: |
          git config user.name otelbot
          git config user.email 197425009+otelbot@users.noreply.github.com

      - uses: $/.github/actions/install-lychee

      - name: Fix link cache
        env:
          # Authenticated github.com link checks (rate limits)
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run ci:min
          npm run ci:prepare
          npm run fix:link-cache

      - name: Create pull request # zizmor: ignore[superfluous-actions] Manages the commit, update branch, and PR lifecycle.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            data/community/members.yaml
            link-cache.jsonc
          author: otelbot <197425009+otelbot@users.noreply.github.com>
          committer: otelbot <197425009+otelbot@users.noreply.github.com>
          token: ${{ steps.otelbot-token.outputs.token }}
          branch: otelbot/update-community-members
          delete-branch: true
          title: Update community members
          body: |
            This pull request contains automated updates to files by the GitHub Action.

  report-failure:
    needs: auto-update
    if: failure() && github.repository == 'open-telemetry/opentelemetry.io'
    uses: $/.github/workflows/reusable-report-failure.yml
    permissions:
      issues: write # Pass through for failure tracking issues
      contents: read
