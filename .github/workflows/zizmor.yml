name: zizmor scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, per the shared-workflow consumer template: the action installs
    # the latest zizmor, so a cadence surfaces new-rule findings between pushes.
    - cron: 45 9 * * 5
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Zizmor Security Analysis
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@d9b812f9924a121c6a8276ea2f9e6f5b622cdd4d # v0.10.0
    with:
      persona: pedantic
