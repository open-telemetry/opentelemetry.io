name: Sync Collector component docs (fork)

on:
  workflow_dispatch:

permissions:
  contents: read

# Do not overlap branch, issue, and PR updates during fork testing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-collector-docs-fork:
    name: Sync Collector component documentation (fork testing)
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the generated documentation branch.
      pull-requests: write # Create or update the generated documentation PR.
      issues: write # Report collector metadata quality problems.
    # Only run on forks, not official repo
    if: github.repository != 'open-telemetry/opentelemetry.io'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] Required by collector-sync.sh's later git push.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Sync collector documentation
        run: bash .github/scripts/collector-sync.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
