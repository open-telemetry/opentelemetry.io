name: Dev build

on:
  workflow_dispatch:
    inputs:
      submodule_path_regex:
        description: Regex of submodule paths to update to HEAD before building.
        default: content-modules
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: BUILD and CHECK LINKS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: fix:link-cache needs the drift-status baseline commit
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run ci:min
      - run: npm run ci:prepare

      - uses: ./.github/actions/install-lychee

      - run: |
          mkdir -p tmp
          npm run fix-and-test:all 2>&1 | tee tmp/build-log.txt
        env:
          CMD_SKIP: i18n|registry
          GET: no # For details, see: https://opentelemetry.io/docs/contributing/development/#submodule-changes
          # Authenticated github.com link checks (rate limits) in fix:link-cache
          GITHUB_TOKEN: ${{ github.token }}
          PIN_SKIP: ${{ inputs.submodule_path_regex }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-etc
          include-hidden-files: true # for .lycheecache
          path: |
            tmp/build-log.txt
            .lycheecache

  check-link-cache:
    name: LINK CACHE updates?
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: build-log-etc }
      - name: Does the link cache need updating?
        run: npm run diff:fail

  check-build-log-for-issues:
    name: WARNINGS in build log?
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: build-log-etc }
      - run: cat tmp/build-log.txt
      - run: scripts/check-build-log.sh
