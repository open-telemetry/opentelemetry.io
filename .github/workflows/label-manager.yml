# To learn more about this workflow, see:
#  https://opentelemetry.io/site/build/ci-workflows/#pr-approval-labels
name: Label manager

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Runs pinned actions against base-branch files without executing PR code.
    types:
      - opened
      - reopened
      - synchronize
  workflow_run: # zizmor: ignore[dangerous-triggers] Consumes only a validated numeric PR artifact from the unprivileged workflow.
    workflows:
      - PR review trigger
    types:
      - completed

permissions:
  contents: read

concurrency:
  # Include the event name so a review-triggered workflow_run run never
  # cancels an in-flight pull_request_target run (whose component-label pass
  # would not be re-run by the canceling run).
  group:
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number ||
    github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  add-component-labels:
    name: Add component labels
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Apply component labels to the PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: '.github/component-label-map.yml'

  update-approval-labels:
    name: Update approval labels
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'open-telemetry' && (github.event_name !=
      'workflow_run' || github.event.workflow_run.conclusion == 'success')
    permissions:
      actions: read # Download the triggering review workflow's PR-number artifact.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Download PR number artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Set PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ ! -f pr-number.txt ]]; then
              echo "Error: pr-number.txt artifact file not found." >&2
              exit 1
            fi
            PR_NUM="$(tr -d '[:space:]' < pr-number.txt)"
            if [[ -z "$PR_NUM" || ! "$PR_NUM" =~ ^[0-9]+$ ]]; then
              echo "Error: Invalid PR number from artifact: '$PR_NUM'. Expected a non-empty integer." >&2
              exit 1
            fi
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "$PR_NUMBER" || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Error: Invalid PR number from event: '$PR_NUMBER'. Expected a non-empty integer." >&2
              exit 1
            fi
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_DOCS_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_DOCS_PRIVATE_KEY }}
          permission-contents: read
          permission-members: read
          permission-pull-requests: write

      - name: Update approval labels
        continue-on-error: true
        run: ./.github/scripts/pr-approval-labels.sh
        env:
          # Use the app token to read org team membership
          GITHUB_TOKEN: ${{ steps.otelbot-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          PUBLISH_DATE_LABELS: blog
