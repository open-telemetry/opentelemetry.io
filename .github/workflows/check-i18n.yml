name: i18n

on:
  merge_group:
  pull_request:

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-i18n:
    name: I18N check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # all
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Any files missing hash key?
        run: |
          scripts/check-i18n.sh -n -x -v
          .github/scripts/check-i18n-helper.sh
      - name: Any files with invalid hash keys?
        run: scripts/check-i18n.sh -v
      - name: Changed pages leave an accurate drift state?
        run: node scripts/i18n/drift-pr-guard.mjs
