[build]
publish = "public"
command = "npm run netlify-build:preview"

[build.environment]
# Keep Netlify's automatic npm install inert: no dependency-tree writes, bin
# linking, or lifecycle scripts. If Netlify stops honoring NPM_FLAGS, .npmrc
# still gates scripts, and the clean-tree checks around install:safe catch lock
# drift and other changes visible to Git.
# Pin npm above the package engines floor before the automatic install runs.
NPM_VERSION = "11.17.0"
NPM_FLAGS = "--dry-run --ignore-scripts"

[context.production]
command = "npm run netlify-build:production"

[[redirects]]
from = "https://docs.opentelemetry.io/*"
to = "https://opentelemetry.io/docs/:splat"
force = true

[[redirects]]
from = "https://blog.opentelemetry.io/*"
to = "https://opentelemetry.io/blog/:splat"
force = true

[[edge_functions]]
function = "registry-component-redirect"
path = "/ecosystem/registry/*"

[[edge_functions]]
function = "markdown-negotiation"
path = "/*"

[[edge_functions]]
function = "schema-analytics"
path = "/schemas/*"

[[edge_functions]]
function = "asset-tracking"
pattern = "/(.*)\\.(md|txt)$"

# cSpell:ignore nosniff sameorigin

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self';"
