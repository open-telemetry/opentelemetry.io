license: Apache 2.0
description:
  Combines metric datapoints that share the same type, timestamp, and
  attributes into a single aggregate. Intended to be paired with an upstream
  processor that drops high-cardinality attributes — this processor then
  merges the datapoints that collapse together, producing a single
  well-formed datapoint per (timestamp, attribute-set) even when aggregation
  runs across multiple collector pods.
