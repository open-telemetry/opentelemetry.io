license: Apache 2.0
description:
  Converts the legacy OpenTelemetry Summary metric type into a modern
  representation. Each Summary is split into a delta count, a sum gauge,
  and one gauge per quantile (min, max, and percentiles), letting downstream
  components that don't understand Summary work with plain counters and
  gauges. Non-Summary metrics pass through unchanged.
