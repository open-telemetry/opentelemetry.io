description:
  Agentic Ledger is a local-first flight recorder for AI agents, a transparent
  LLM proxy that records every call, tool use, cost, and loop. It natively
  ingests OTLP/HTTP (JSON) GenAI spans and log events at /v1/traces and
  /v1/logs, and exports its own captures as OTLP GenAI spans to any collector.
