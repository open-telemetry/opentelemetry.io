description:
  Cardinal is an observability backend that natively ingests OpenTelemetry
  logs, metrics, and traces. Data lands in your own S3-compatible object
  store as Apache Parquet and is queryable through the Cardinal Grafana
  app. Cardinal also ships an OpenTelemetry Collector distribution with
  processors that reduce cardinality and cost before egress.
